services:
  - type: web
    name: zm-api
    runtime: node
    region: oregon
    plan: free

    buildCommand: pnpm install --frozen-lockfile && pnpm --filter=@zm/shared build && pnpm --filter=@zm/db build && pnpm --filter=@zm/api build
    preDeployCommand: pnpm --filter=@zm/db exec prisma migrate deploy
    startCommand: node apps/api/dist/main

    healthCheckPath: /api/health

    envVars:
      - key: NODE_VERSION
        value: 20
      - key: PNPM_VERSION
        value: 9.15.4
      - key: PORT
        value: 3001
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: FRONTEND_URL
        sync: false
